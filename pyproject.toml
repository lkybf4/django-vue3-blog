[project]
name = "self-blog"
version = "1.0.0"
description = "个人博客系统 - Django + DRF + Vue3"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18,<3.19",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "django-cors-headers>=4.3",
    "drf-spectacular>=0.27",
    "django-filter>=24.1",
    "markdown>=3.5",
    "bleach>=6.1",
    "pillow>=10.2",
    "psycopg2-binary>=2.9",
    "whitenoise>=6.6",
    "dj-database-url>=3.0",
    "gunicorn>=23.0",
]
